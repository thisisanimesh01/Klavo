name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: |
          cd backend
          npm ci

      - name: Run backend tests
        env:
          MONGO_URI: mongodb://localhost:27017/test_klavo
          JWT_SECRET: test_jwt_secret_key_ci
        run: |
          node --test backend/tests/*.test.js

      - name: Run automated secret leak regression scan
        run: |
          node scripts/scan_secrets.js

      - name: Run production preflight verification
        env:
          NODE_ENV: test
          MONGO_URI: mongodb://localhost:27017/test_klavo
          JWT_SECRET: test_jwt_secret_key_ci_32_characters_minimum
        run: |
          cd backend
          node src/utils/preflightCheck.js --skip-db

  frontend-checks:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Run frontend tests
        run: |
          node --test frontend/tests/*.test.js

      - name: Build frontend production bundle
        run: |
          cd frontend
          npm run build

  e2e-tests:
    name: Playwright E2E Test Suite
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install root dependencies & Playwright browsers
        run: |
          npm ci || npm install
          npx playwright install --with-deps chromium

      - name: Install backend dependencies
        run: |
          cd backend
          npm ci

      - name: Install frontend dependencies & build bundle
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Run Playwright E2E Tests
        env:
          CI: true
          NODE_ENV: test
          MONGO_URI: mongodb://localhost:27017/e2e_test_klavo
          JWT_SECRET: e2e_test_jwt_secret_key_ci_32_characters_minimum
        run: |
          npx playwright test

      - name: Upload Playwright Test Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
